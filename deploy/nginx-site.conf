# @DOMAIN@: the Hikvision NVR web UI (@NVR@) through nginx, with live view
# through go2rtc and localservice.py instead of Hikvision's plugin. Installed by deploy/install-nginx.sh
# from deploy/nginx-site.conf - edit that and re-run instead of editing this.

upstream nvrlv_nvr {
    server @NVR@:443;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @DOMAIN@;

    ssl_certificate     @CERT@;
    ssl_certificate_key @KEY@;

    client_max_body_size 0;      # firmware and config uploads
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;       # long-lived ISAPI requests (event streams)
    proxy_send_timeout 1h;
    proxy_ssl_verify off;        # the NVR has a self-signed certificate (LAN hop)

    # Everything else: the NVR, unchanged.
    location / {
        proxy_pass https://nvrlv_nvr;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # The NVR's pages: add the script that draws the plugin's video windows
    # (web/nvr-ls.js). Conditional headers are dropped so the NVR never answers
    # 304 for a copy cached without it.
    location ~ ^/doc/page/[^/]+\.asp$ {
        proxy_pass https://nvrlv_nvr;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store" always;
        sub_filter_once on;
        sub_filter '</head>' '<script src="/nvr-live/nvr-ls.js" defer></script></head>';
    }

    # The page header template: hide "Download Plug-in" (shown in every
    # browser but IE, whether or not the Local Service answers).
    location = /doc/page/common/header.asp {
        proxy_pass https://nvrlv_nvr;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-cache" always;
        sub_filter_once on;
        sub_filter 'ng-show="bShowDownloadLocalService"' 'ng-show="false"';
    }

    # The NVR's player script looks for Hikvision's Local Service on the
    # viewer's machine (image probe and WebSocket on 127.0.0.1:33686-33695).
    # Point both at this site, where localservice.py answers, and use the
    # WebSocket transport in every browser (Firefox would otherwise poll with
    # images over plain HTTP).
    location = /doc/script/lib/jsPlugin/jsVideoPlugin-1.0.0.min.js {
        proxy_pass https://nvrlv_nvr;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-cache" always;
        sub_filter_types application/javascript;
        sub_filter_once on;
        sub_filter '"http://127.0.0.1:"+e+"/imghttp/local?update="' 'location.origin+"/nvr-ls/"+e+"/imghttp/local?update="';
        sub_filter '"ws://127.0.0.1:"+r.oOptions.iPort' '(location.protocol==="https:"?"wss://":"ws://")+location.host+"/nvr-ls/ws?page="+(window.top.__nvrlvPage||(window.top.__nvrlvPage=Math.random().toString(36).slice(2,14)))+"&port="+r.oOptions.iPort';
        sub_filter 'if(vt.oUtils.browser().chrome){try{i.oRequest=new ct.WebSocketRequest(' 'if(true){try{i.oRequest=new ct.WebSocketRequest(';
    }

    # The emulated Local Service (localservice.py), for logged-in browsers only.
    # Only the first port of the range answers the probe, so the page connects once.
    location = /nvr-ls/33686/imghttp/local {
        auth_request /nvrlv-auth;
        empty_gif;
    }

    location = /nvr-ls/ws {
        if ($args !~ "^page=[A-Za-z0-9]{1,32}&port=[0-9]{1,5}$") { return 403; }
        auth_request /nvrlv-auth;
        proxy_pass http://127.0.0.1:1985/plugin?$args;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /nvr-ls/bridge {
        if ($args !~ "^page=[A-Za-z0-9]{1,32}$") { return 403; }
        auth_request /nvrlv-auth;
        proxy_pass http://127.0.0.1:1985/bridge?$args;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /nvr-ls/ {
        return 404;
    }

    # The page script and the stream list (no secrets).
    location /nvr-live/ {
        alias @WEBROOT@/;
        add_header Cache-Control "no-cache" always;
    }

    # go2rtc has no authentication of its own. Only browsers with a valid NVR
    # login session get through, and only to the read-only pieces the player
    # needs: no API that lists sources or adds streams.
    location = /nvrlv-auth {
        internal;
        proxy_pass https://nvrlv_nvr/ISAPI/Security/userCheck;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location ~ ^/go2rtc/(stream\.html|video-stream\.js|video-rtc\.js)$ {
        limit_except GET { deny all; }
        auth_request /nvrlv-auth;
        proxy_pass http://127.0.0.1:1984/$1;
        proxy_set_header Host $host;    # go2rtc checks the WebSocket Origin against it
        proxy_set_header Connection "";
    }

    location = /go2rtc/api/ws {
        if ($args !~ "^src=ch[0-9]+_(main|sub|main_h264)$") { return 403; }
        limit_except GET { deny all; }
        auth_request /nvrlv-auth;
        proxy_pass http://127.0.0.1:1984/api/ws?$args;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /go2rtc/ {
        return 404;
    }
}
